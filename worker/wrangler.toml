name = "angaros"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Hourly purge of items older than 7 days.
[triggers]
crons = ["17 * * * *"]

# One-time setup (see docs/self-hosting.md):
#   npx wrangler@4 d1 create angaros            -> paste the printed database_id below
#   npx wrangler@4 d1 migrations apply angaros --remote
#   angaros master | npx wrangler@4 secret put PAIR_MASTER
#   npx wrangler@4 deploy
[[d1_databases]]
binding = "DB"
database_name = "angaros"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder: replace with your own D1 id
