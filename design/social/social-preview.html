<!doctype html>
<!-- Source of docs/assets/social-preview.png (1280x640). Render: see design/social/README.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Vazirmatn; font-weight: 700; src: url("../../android/app/src/main/res/font/vazirmatn_bold.ttf"); }
  @font-face { font-family: Vazirmatn; font-weight: 500; src: url("../../android/app/src/main/res/font/vazirmatn_medium.ttf"); }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #F3F5FF;
    background: radial-gradient(900px 600px at 82% 40%, rgba(43,179,192,.35), transparent 60%),
                linear-gradient(135deg, #2D49B8 0%, #1C2C7E 45%, #0B1440 100%); position: relative; }
  .ring { position: absolute; right: -40px; top: 40px; width: 560px; height: 560px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.07); }
  .logo { position: absolute; right: 70px; top: 90px; width: 460px; height: 460px; border-radius: 96px;
    box-shadow: 0 40px 80px rgba(5,10,40,.55); }
  .text { position: absolute; left: 80px; top: 120px; width: 640px; }
  .name { font-size: 104px; font-weight: 700; letter-spacing: -2px; line-height: 1; margin: 0; }
  .fa { font-family: Vazirmatn; font-weight: 700; font-size: 44px; color: #F2B84B; margin: 18px 0 0; direction: rtl; text-align: left; }
  .tag { font-size: 40px; font-weight: 600; line-height: 1.2; margin: 34px 0 0; }
  .sub { font-size: 23px; color: #BFC8F2; margin: 22px 0 0; line-height: 1.45; }
  .chips { position: absolute; left: 80px; bottom: 64px; display: flex; gap: 12px; }
  .chip { font-size: 19px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18); color: #E6EAFF; }
</style>
</head>
<body>
  <div class="ring"></div>
  <img class="logo" src="../logo/renders/logo.png" alt="">
  <div class="text">
    <p class="name">Angaros</p>
    <p class="fa">آنگاروس</p>
    <p class="tag">Your phone, for your AI agents.</p>
    <p class="sub">SMS, contacts and call log for Claude, Hermes, Codex,<br>Cursor and any MCP client. End-to-end encrypted.</p>
  </div>
  <div class="chips"><span class="chip">MCP server</span><span class="chip">Android</span><span class="chip">Self-hosted relay</span><span class="chip">Open source · MIT</span></div>
</body>
</html>
