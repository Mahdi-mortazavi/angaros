version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      androidx: { patterns: ["androidx.*"] }
  - package-ecosystem: pip
    directory: /pc
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /worker
    schedule: { interval: monthly }
