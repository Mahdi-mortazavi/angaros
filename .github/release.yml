# Categories for GitHub's auto-generated release notes.
changelog:
  exclude:
    labels: [ignore-for-release]
    authors: [dependabot]
  categories:
    - title: New
      labels: [enhancement, feat]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation, docs]
    - title: Other changes
      labels: ["*"]
